<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      color: #f7f7ff; background: #0b1020;
      background-image: radial-gradient(ellipse at 18% 20%, #5434a866 0, transparent 36%), radial-gradient(ellipse at 82% 80%, #087f8c66 0, transparent 38%), linear-gradient(135deg, #0b1020, #111a30 60%, #0c1725);
    }
    body::before, body::after { content: ""; position: fixed; width: 24rem; height: 24rem; border-radius: 50%; filter: blur(80px); opacity: .22; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    body::before { top: -12rem; right: 8%; background: #a855f7; }
    body::after { bottom: -15rem; left: 10%; background: #22d3ee; animation-delay: -5s; }
    main { position: relative; width: min(90vw, 720px); padding: clamp(2rem, 7vw, 4.5rem); text-align: center; border: 1px solid #ffffff22; border-radius: 28px; background: linear-gradient(145deg, #ffffff12, #ffffff05); box-shadow: 0 30px 100px #0008, inset 0 1px #ffffff1c; backdrop-filter: blur(18px); animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .spark { display: inline-grid; place-items: center; width: 58px; height: 58px; margin-bottom: 1.5rem; border-radius: 18px; font-size: 1.65rem; background: linear-gradient(135deg, #a855f7, #22d3ee); box-shadow: 0 10px 35px #7c3aed66; }
    .eyebrow { margin: 0 0 .8rem; color: #a5f3fc; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 6.4rem); line-height: .98; letter-spacing: -.065em; }
    h1 span { display: block; color: transparent; background: linear-gradient(90deg, #c4b5fd, #67e8f9); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 32rem; margin: 1.4rem auto 0; color: #c2c9da; font-size: clamp(1rem, 2.6vw, 1.15rem); line-height: 1.75; }
    .rule { width: 54px; height: 3px; margin: 2rem auto 0; border-radius: 9px; background: linear-gradient(90deg, #a855f7, #22d3ee); }
    footer { position: fixed; bottom: 1.4rem; color: #a2abc0; font-size: .78rem; letter-spacing: .08em; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(45px, 35px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to start</p>
    <h1>Hello,<span>World!</span></h1>
    <p>Every great idea begins with a first line. Here’s to what you’ll create next.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <footer>MADE FOR THE BEGINNING</footer>
</body>
</html>
